# ---------- 자주 묻는 질문 ----------
# 답에 '자동'이라고 쓴 질문은 위 작물 목록으로 답이 자동으로 만들어집니다.
# {전화번호}, {주소} 라고 쓰면 위 기본 정보의 값으로 바뀝니다.
자주묻는질문:
  - 질문: 주문은 어떻게 하나요?
    답: 전화나 문자({전화번호})로 원하시는 작물과 양, 받으실 주소를 알려주세요. 가격과 보내드릴 날짜를 안내해 드리고 택배로 보내드립니다.
  - 질문: 강화 고구마는 언제 살 수 있나요?
    답: 강화 고구마는 9월부터 11월까지 수확하고, 숙성·저장한 고구마는 이듬해 2월까지 판매합니다. 재고가 떨어지면 일찍 마감될 수 있습니다.
  - 질문: 강화 순무와 순무김치는 언제 살 수 있나요?
    답: 순무는 10월부터 12월까지, 순무김치는 10월부터 이듬해 3월까지 판매합니다. 김장철에는 일찍 마감될 수 있으니 미리 연락 주세요.
  - 질문: 몇 월에 어떤 작물을 살 수 있나요?
    답: 자동
  - 질문: 김장용 고춧가루를 미리 주문할 수 있나요?
    답: 네. 고춧가루는 9월부터 판매하며 김장철에는 주문이 몰리니 미리 전화나 문자로 말씀해 주세요.
  - 질문: 식당이나 단체 대량 주문, 납품도 되나요?
    답: 네. 식당, 단체, 기업 등 대량 주문도 문의 주시면 가능한 범위 내에서 최대한 맞춰 드리겠습니다.
  - 질문: 농원에 직접 가서 살 수 있나요?
    답: 네. {주소} 농원에서 직접 보고 사실 수 있습니다. 밭일로 자리를 비울 때가 있으니 오시기 전에 전화 주세요.
  - 질문: 강화풍물시장 장날에도 판매하나요?
    답: 강화읍 강화풍물시장 장날(2·7일장)에 나가 판매할 때가 있습니다. 매번 나가지는 않으니 전화로 미리 확인해 주세요.
