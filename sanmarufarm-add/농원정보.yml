# ---------- 구매 방법 ----------
# '짧게'는 오시는길 칸에 한 줄로 보이는 이름입니다.
구매방법:
  - 제목: 농원 방문 구매
    짧게: 농원 방문
    설명: 교산리 농원에 들르시면 그날 있는 작물을 직접 보고 사실 수 있습니다.
    안내: 밭일로 자리를 비울 때가 있으니 오시기 전에 전화 주세요.
  - 제목: 택배 구매
    짧게: 택배
    설명: 전화나 문자로 주문하시면 수확해서 정성껏 포장해 택배로 보내드립니다.
    안내: 원하시는 작물과 양만 말씀해 주세요.
  - 제목: 강화풍물시장 장날 방문 구매
    짧게: 강화풍물시장 장날
    설명: 강화읍 강화풍물시장 장날(2·7일장)에 나가 판매할 때가 있습니다.
    안내: 장에 나가는 날은 전화로 미리 확인해 주세요.

# ---------- 주문·대량 문의 ----------
주문안내: 원하시는 작물과 양만 말씀해 주시면 가격과 보내드릴 날짜를 안내해 드립니다.
대량문의: 식당, 단체, 기업 등 대량 주문도 문의 주시면 가능한 범위 내에서 최대한 맞춰 드리겠습니다.

