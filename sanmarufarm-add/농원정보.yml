# ---------- 농원소개 ----------
농원소개:
  사진: about-ganghwa-road.jpg
  제목: |
    매일 밭에 나가는 마음으로
    농사짓습니다
  문단:
    - 산마루 농원은 강화도 북쪽, 고인돌이 남아 있는 양사면 교산리에서 부부가 함께 꾸려가는 농원입니다.
    - 봄에는 감자와 고추 모종을 심고, 여름에는 오이와 고추를 따고, 가을에는 고구마와 순무를 캐고 콩과 깨를 텁니다. 그렇게 철마다 거둔 작물과 집에서 담근 장, 순무김치를 농원을 찾아오시는 분들께, 그리고 전화로 주문하시는 분들께 택배로 보내드립니다.
    - 큰 농장은 아니지만, 우리 식구가 먹는 것과 똑같이 길러 보냅니다.

